name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run bench
      - run: npm run bench -- --budget=150 interceptors

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      # Trusted Publishing needs npm 11.5.1+; setup-node's bundled version
      # may lag behind. `npx npm@latest` runs a fresh npm just for this
      # command instead of a global install, which failed here once
      # already for reasons unrelated to publishing (see run 33413356850).
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npx --yes npm@latest publish --tag beta
          else
            npx --yes npm@latest publish
          fi
